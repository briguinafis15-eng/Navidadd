
<!DOCTYPE html>
<html>

<head>
    <title>Comida Navideña</title>
    <link rel="stylesheet" href="css/comida.css">
</head>

<body>

    <h1>COMIDAS NAVIDEÑAS MIAM MIAM</h1>

    <nav>
        <a href="index.html">Bienvenida</a>
        <a href="historia.html">Historia</a>
        <a href="personajes.html">Personajes</a>
        <a href="regalos.html">Regalos</a>

    </nav>

    <h2>¡Nuestro menú navideño!</h2>

    <p>
        ELIGE PERO NO EXAGERES

    <form>

        <div class="comidas">

            <div class="plato">

                <h2>Pavo</h2>

                <img src="img/PAVO.jpg" width="180" height="150">

                <p>Precio: Bs 120</p>

                <label>¿Deseas este plato?</label>

                <br>

                <input type="radio" name="pavo" id="si1" value="Si">
                <label for="si1">Sí</label>

                <input type="radio" name="pavo" id="no1" value="No">
                <label for="no1">No</label>

            </div>

            <div class="plato">

                <h2>Ensalada de frutas</h2>

                <img src="img/ENSALADA.jpg" width="180" height="150">

                <p>Precio: Bs 25</p>

                <label>¿Deseas este plato?</label>

                <br>

                <input type="radio" name="ensalada" id="si2" value="Si">
                <label for="si2">Sí</label>

                <input type="radio" name="ensalada" id="no2" value="No">
                <label for="no2">No</label>

            </div>

            <div class="plato">

                <h2>Paneton</h2>

                <img src="img/PANETONNN.jpg" width="180" height="150">

                <p>Precio: Bs 35</p>

                <label>¿Deseas este plato?</label>

                <br>

                <input type="radio" name="paneton" id="si3" value="Si">
                <label for="si3">Sí</label>

                <input type="radio" name="paneton" id="no3" value="No">
                <label for="no3">No</label>

            </div>

            <div class="plato">

                <h2>Chocolate caliente</h2>

                <img src="img/CHOCOLATE.jpg" width="180" height="150">

                <p>Precio: Bs 15</p>

                <label>¿Deseas este plato?</label>

                <br>

                <input type="radio" name="chocolate" id="si4" value="Si">
                <label for="si4">Sí</label>

                <input type="radio" name="chocolate" id="no4" value="No">
                <label for="no4">No</label>

            </div>

        </div>

        <h2>Datos del pedido</h2>

        <label>Nombre:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">

        <br><br>

        <label>Fecha de entrega:</label>
        <input type="date" id="fecha">

        <br><br>

        <label>Comentarios:</label>
        <input type="text" id="comentario" placeholder="Alguna indicacion">

        <br><br>

        <input type="submit" value="Enviar pedido">

        <input type="reset" value="Borrar">

    </form>


</body>
</html>
